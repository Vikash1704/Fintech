# ---------------- HTTP ----------------
http.host=0.0.0.0
http.port=8082
http.path=/velocity

# ---------------- RabbitMQ / AMQP (local Docker defaults) ----------------
# For anything other than local development, replace the password with a secure property.
amqp.host=localhost
amqp.port=5672
amqp.username=guest
amqp.password=${AMQP_PASSWORD}
amqp.virtualHost=/

amqp.queue.high=fraud-high-priority
amqp.queue.standard=fraud-standard
amqp.queue.dlq=fraud-dlq
# Message priority: HIGH=10 (queue must be declared with x-max-priority=10), LOW/MEDIUM=0
amqp.priority.high=10
amqp.priority.standard=0

# ---------------- Velocity (sliding window) ----------------
# Window length in seconds (default 5 minutes)
velocity.windowSeconds=300
# Team contract example threshold
velocity.threshold=4
# GT  = thresholdExceeded when count >  threshold  ("more than 4")   <-- default, CONFIRM with team
# GTE = thresholdExceeded when count >= threshold  ("4 or more")
velocity.comparison=GT
# Safety cap on timestamps kept per cardToken (must be larger than threshold)
velocity.maxTimestamps=1000
# false = use server time (default, cannot be spoofed by caller)
# true  = use the top-level "eventTimestamp" field of the event (required for deterministic expiry tests)
velocity.useEventTimestamp=false
# Object Store housekeeping TTL (seconds). Must be >= velocity.windowSeconds.
# This is NOT what implements the window; the window is computed from stored timestamps.
velocity.store.ttlSeconds=600
# Per-cardToken lock (single Mule runtime instance)
velocity.lock.maxRetries=20
velocity.lock.retryMillis=100
velocity.lock.ttlSeconds=30

# ---------------- Retry ----------------
# until-successful: 1 initial attempt + maxRetries retries
retry.maxRetries=3
retry.millisBetweenRetries=1000

# ---------------- Dead-letter (Contract 8: common error / DLQ schema) ----------------
# failureStage written into every DLQ message for a queue-publish failure.
# PROPOSED by Member 3 (NOT an agreed value). The contract only shows "fraud-persistence" as an example.
# Requires confirmation by Member 5 (DLQ owner) before being treated as official.
dlq.failureStage=queue-publish

# ---------------- Test hook (keep false outside DLQ tests) ----------------
test.injectPrimaryPublishFailure=false
